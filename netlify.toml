[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA 兜底：所有路由回到 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 带哈希指纹的静态资源长期缓存
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
